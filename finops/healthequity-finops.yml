specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: HealthEquity
providerId: healthequity
publisherName: HealthEquity, Inc.
serviceCategory: Healthcare Benefits / HSA Custodian Partner API
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Healthcare
  - HSA
  - Benefits
  - FinOps
  - Cost Management
  - FOCUS
description: 'FOCUS-aligned FinOps placeholder for HealthEquity: employer / benefits-admin partner
  integration bundled into the broader benefits administration contract. Meters describe
  enrollment-driven volumes and contribution events used for capacity allocation.'
notes: No public commercial model is published for the API. Reconcile against the partner / employer
  agreement.
sources:
  - https://www.healthequity.com/
principles:
  - name: Visibility
    description: Track API request volume via the HealthEquity partner gateway logs; correlate with
      enrollment events and contribution cycles.
  - name: Allocation
    description: Allocate integration cost across employer clients and benefit programs (HSA / FSA
      / HRA / commuter) using the calling partner identifier.
  - name: Optimization
    description: Batch enrollment uploads and contribution files; cache employer / plan reference
      data; pre-warm capacity ahead of open enrollment.
  - name: Accountability
    description: Designate a HealthEquity integration owner per partner; review API utilization at
      year-end with attention to open-enrollment surges.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Rate Optimization
      - Workload Optimization
      - Cloud Sustainability
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - FinOps Education and Enablement
      - Invoicing and Chargeback
      - Onboarding Workloads
      - Intersecting Disciplines
billingModel:
  pricingCategory: Subscription
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Tax
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: HealthEquity API
  ServiceCategory: Healthcare Benefits / HSA Custodian Partner API
  ProviderName: HealthEquity
  PublisherName: HealthEquity, Inc.
  InvoiceIssuerName: HealthEquity, Inc.
  PricingCategory: Subscription
  PricingUnit: partner-agreement
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: api_requests
    description: Partner-integration request volume (allocation meter)
    unit: request
    aggregation: sum
    dimensions:
      - partner
      - employer
      - endpoint
  - name: enrollments_processed
    description: Member enrollment events processed via the API
    unit: enrollment
    aggregation: sum
    dimensions:
      - employer
      - benefit_type
  - name: contribution_files
    description: Contribution / payroll files processed
    unit: file
    aggregation: sum
    dimensions:
      - employer
      - benefit_type
apis:
  - name: HealthEquity API
    baseURL: https://api.healthequity.com
    tags:
      - Healthcare
      - HSA
      - Benefits
    serviceName: HealthEquity API
    serviceCategory: API
unitEconomics:
  - name: Cost per Enrollment Processed
    metric: billed_cost / enrollments_processed
    target: TBD
  - name: Cost per Employer Client
    metric: billed_cost / active_employers
    target: TBD
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
