description: HealthEquity is a US health-savings account (HSA) and consumer-directed-benefits
  custodian. Its API surface is exposed to employer / payroll / benefits-administration partners
  rather than the general developer market. There is no public per-tier API pricing page; access is
  bundled into employer / partner administration agreements.
notes: No public API pricing or self-service plan catalog is available. The placeholder Enterprise
  plan records the expected commercial shape; reconcile against the partner integration agreement.
